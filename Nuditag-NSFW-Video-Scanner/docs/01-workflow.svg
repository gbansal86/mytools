<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#f6f8fa"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">Nuditag Windows workflow</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="17" fill="#57606a">The scan is read-only. Moving files is a separate optional step.</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="135" rx="14" width="200" height="120" fill="#ffffff" stroke="#0969da" stroke-width="3"/>
    <text x="155" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0969da">1. SETUP</text>
    <text x="155" y="207" text-anchor="middle" font-size="16" fill="#24292f">Install under</text>
    <text x="155" y="232" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#24292f">E:\Nuditag</text>
    <text x="280" y="205" font-size="36" fill="#57606a">→</text>
    <rect x="330" y="135" rx="14" width="220" height="120" fill="#ffffff" stroke="#8250df" stroke-width="3"/>
    <text x="440" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#8250df">2. CHOOSE PATHS</text>
    <text x="440" y="207" text-anchor="middle" font-size="16" fill="#24292f">SearchPaths.txt</text>
    <text x="440" y="232" text-anchor="middle" font-size="16" fill="#24292f">ExcludePaths.txt</text>
    <text x="575" y="205" font-size="36" fill="#57606a">→</text>
    <rect x="625" y="135" rx="14" width="200" height="120" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
    <text x="725" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#1a7f37">3. SCAN</text>
    <text x="725" y="207" text-anchor="middle" font-size="16" fill="#24292f">Videos are read</text>
    <text x="725" y="232" text-anchor="middle" font-size="16" fill="#24292f">CSV is written</text>
    <text x="850" y="205" font-size="36" fill="#57606a">→</text>
    <rect x="900" y="135" rx="14" width="245" height="120" fill="#ffffff" stroke="#bf8700" stroke-width="3"/>
    <text x="1022" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#9a6700">4. REVIEW</text>
    <text x="1022" y="207" text-anchor="middle" font-size="16" fill="#24292f">Open NSFW CSV</text>
    <text x="1022" y="232" text-anchor="middle" font-size="16" fill="#24292f">Check candidates</text>
    <path d="M1022 275 L1022 320 L725 320" fill="none" stroke="#cf222e" stroke-width="3"/>
    <polygon points="725,320 742,311 742,329" fill="#cf222e"/>
    <rect x="500" y="285" rx="12" width="225" height="90" fill="#fff8c5" stroke="#cf222e" stroke-width="2"/>
    <text x="612" y="319" text-anchor="middle" font-size="18" font-weight="700" fill="#cf222e">OPTIONAL 5. MOVE</text>
    <text x="612" y="347" text-anchor="middle" font-size="15" fill="#24292f">Dry run → type MOVE</text>
  </g>
</svg>