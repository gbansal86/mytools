  <rect x="70" y="135" rx="14" width="420" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Before</text>
  <text x="100" y="225" font-family="Consolas, monospace" font-size="20" fill="#24292f">E:\Movies\</text>
  <text x="140" y="265" font-family="Consolas, monospace" font-size="20" fill="#cf222e">clip.mp4</text>
  <text x="100" y="325" font-family="Arial, sans-serif" font-size="16" fill="#57606a">Dry run prints the proposed destination.</text>
