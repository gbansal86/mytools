<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f6f8fa"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">Reading a Nuditag score</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="17" fill="#57606a">Default wrapper threshold = 0.40</text>
  <line x1="100" y1="205" x2="1100" y2="205" stroke="#24292f" stroke-width="6"/>
  <rect x="100" y="180" width="400" height="50" fill="#dafbe1" opacity="0.9"/>
  <rect x="500" y="180" width="600" height="50" fill="#ffebe9" opacity="0.9"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#24292f">
    <text x="100" y="265" text-anchor="middle">0.00</text>
    <text x="300" y="265" text-anchor="middle">0.20</text>
    <text x="500" y="265" text-anchor="middle" font-weight="700">0.40 cutoff</text>
    <text x="800" y="265" text-anchor="middle">0.70</text>
    <text x="1100" y="265" text-anchor="middle">1.00</text>
  </g>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1a7f37">SFW</text>
  <text x="800" y="325" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#cf222e">NSFW</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#57606a">Use the score to rank/review candidates. It is not guaranteed to be a calibrated probability.</text>
</svg>