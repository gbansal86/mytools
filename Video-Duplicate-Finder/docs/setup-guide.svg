<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#ffffff"/><style>.h{font:700 28px Segoe UI,Arial;fill:#1f2328}.n{font:700 20px Segoe UI,Arial;fill:#fff}.t{font:18px Segoe UI,Arial;fill:#1f2328}.s{font:15px Segoe UI,Arial;fill:#57606a}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:2;rx:14}.num{fill:#0969da}.arrow{stroke:#0969da;stroke-width:4}</style>
<text x="50" y="48" class="h">First-time setup — 4 simple steps</text>
<g transform="translate(50,85)"><rect class="box" width="1100" height="82"/><circle class="num" cx="45" cy="41" r="24"/><text x="45" y="48" text-anchor="middle" class="n">1</text><text x="90" y="34" class="t">Install Python 3.10+ once</text><text x="90" y="59" class="s">When installing Python, enable “Add Python to PATH”.</text></g>
<g transform="translate(50,190)"><rect class="box" width="1100" height="82"/><circle class="num" cx="45" cy="41" r="24"/><text x="45" y="48" text-anchor="middle" class="n">2</text><text x="90" y="34" class="t">Double-click INSTALL_FIRST.bat</text><text x="90" y="59" class="s">Missing FFmpeg is downloaded into this folder under _runtime — not installed system-wide.</text></g>
<g transform="translate(50,295)"><rect class="box" width="1100" height="82"/><circle class="num" cx="45" cy="41" r="24"/><text x="45" y="48" text-anchor="middle" class="n">3</text><text x="90" y="34" class="t">Edit video_paths.txt</text><text x="90" y="59" class="s">One folder per line, e.g. D:\Videos and E:\Downloaded Videos. Subfolders are automatic.</text></g>
<g transform="translate(50,400)"><rect class="box" width="1100" height="82"/><circle class="num" cx="45" cy="41" r="24"/><text x="45" y="48" text-anchor="middle" class="n">4</text><text x="90" y="34" class="t">Double-click run_duplicate_scan.bat</text><text x="90" y="59" class="s">Wait for duplicate_groups.txt and duplicate_report.csv. The scan itself never deletes videos.</text></g>
</svg>
