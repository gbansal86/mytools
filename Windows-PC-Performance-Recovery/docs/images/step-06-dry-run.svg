<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cf222e"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 6 — Preview repairs with DRY RUN</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">Menu option 5 shows the repair actions without changing Windows.</text>
<g filter="url(#shadow)"><rect x="60" y="145" width="760" height="520" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
 <g font-family="Consolas,monospace" font-size="19" fill="#c9d1d9"><rect x="90" y="205" width="650" height="58" rx="8" fill="#3a2e0e" stroke="#f2cc60" stroke-width="2"/><text x="110" y="243" fill="#f2cc60">5. Repair DRY RUN</text><text x="110" y="315">Choose: <tspan fill="#f2cc60">5</tspan></text><text x="110" y="375">Restore point : WOULD ATTEMPT</text><text x="110" y="415">Old temp cleanup : WOULD DELETE eligible TEMP only</text><text x="110" y="455">DISM RestoreHealth : WOULD RUN (if enabled)</text><text x="110" y="495">SFC /scannow : WOULD RUN (if enabled)</text><text x="110" y="555" fill="#3fb950">DryRun: True — no repair action applied</text></g></g>
 <g filter="url(#shadow)"><rect x="880" y="175" width="450" height="125" rx="14" fill="#fff" stroke="#f2cc60" stroke-width="2"/><circle cx="908" cy="203" r="28" fill="#f2cc60"/><text x="908" y="211" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="945" y="211" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#f2cc60">Choose 5</text><text x="905" y="241" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Always preview before option 6.</text><text x="905" y="267" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Dry run does not apply repairs.</text></g>
 <line x1="880" y1="235" x2="745" y2="235" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="880" y="360" width="450" height="145" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="908" cy="388" r="28" fill="#0969da"/><text x="908" y="396" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="945" y="396" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Check every proposed action</text><text x="905" y="426" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">If you do not understand an action,</text><text x="905" y="452" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">stop and review it.</text><text x="905" y="478" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Hardware failure is not fixed here.</text></g>
 <line x1="880" y1="430" x2="795" y2="450" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="880" y="555" width="450" height="100" rx="14" fill="#fff" stroke="#1f883d" stroke-width="2"/><circle cx="908" cy="583" r="28" fill="#1f883d"/><text x="908" y="591" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="945" y="591" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#1f883d">Safe checkpoint</text><text x="905" y="621" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Proceed to Step 7 only if the plan looks appropriate.</text></g>
</svg>