<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f6f8fa"/><text x="55" y="55" font-family="Segoe UI,Arial" font-size="32" font-weight="700" fill="#24292f">Where to find results — and what to share</text><g font-family="Segoe UI,Arial"><rect x="60" y="95" width="510" height="445" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="90" y="135" font-size="22" font-weight="700">Package folder</text><text x="90" y="175" font-size="18" font-family="Consolas,monospace">Runs\PC_RECOVERY_YYYYMMDD_HHMMSS\</text><text x="120" y="215" font-size="17">├─ Phase_A_Baseline\</text><text x="120" y="245" font-size="17">├─ Phase_B_Diagnostics\</text><text x="120" y="275" font-size="17">├─ Analysis\</text><text x="150" y="305" font-size="17" font-weight="700">├─ ANALYSIS_REPORT.txt</text><text x="150" y="335" font-size="17" font-weight="700">├─ HARDWARE_HEALTH_REPORT.txt</text><text x="150" y="365" font-size="17" font-weight="700">├─ FINDINGS.csv</text><text x="150" y="395" font-size="17" font-weight="700">└─ REPAIR_PLAN.json</text><text x="120" y="430" font-size="17">├─ Post-repair data...</text><text x="120" y="460" font-size="17">└─ Before/after reports...</text><text x="90" y="510" font-size="16" fill="#57606a">Option 10 opens the newest run.</text>
<rect x="625" y="95" width="515" height="210" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="655" y="135" font-size="22" font-weight="700" fill="#0969da">For expert / ChatGPT review</text><text x="655" y="175" font-size="18">Choose menu option 9.</text><text x="655" y="207" font-size="18">It compresses the newest run into a ZIP.</text><text x="655" y="239" font-size="18">Upload that ZIP for deeper analysis.</text><text x="655" y="271" font-size="16" fill="#57606a">Review it for private machine/network details first.</text>
<rect x="625" y="335" width="515" height="205" rx="14" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><text x="655" y="375" font-size="22" font-weight="700" fill="#9a6700">Privacy reminder</text><text x="655" y="415" font-size="18">Reports may contain computer name, usernames,</text><text x="655" y="445" font-size="18">paths, IP/MAC details and device identifiers.</text><text x="655" y="480" font-size="18">They are not intended to collect passwords,</text><text x="655" y="510" font-size="18">cookies, tokens or personal document contents.</text></g></svg>