<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cf222e"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 4 — Run the complete pre-repair scan</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">Menu option 1 runs Phase A baseline + Phase B diagnostics + Phase C analysis.</text>
<g filter="url(#shadow)"><rect x="60" y="145" width="760" height="520" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
 <g font-family="Consolas,monospace" font-size="19" fill="#c9d1d9"><rect x="90" y="200" width="650" height="58" rx="8" fill="#102b46" stroke="#58a6ff" stroke-width="2"/><text x="110" y="238" fill="#58a6ff">1. Pre-repair phases A + B + C</text><text x="110" y="310">Choose: <tspan fill="#f2cc60">1</tspan></text><text x="110" y="375" fill="#8b949e">Phase A: baseline measurements...</text><text x="110" y="410" fill="#8b949e">Phase B: hardware + Windows diagnostics...</text><text x="110" y="445" fill="#8b949e">Phase C: evidence analysis...</text><text x="110" y="510" fill="#3fb950">PHASES A+B+C COMPLETE</text><text x="110" y="550" fill="#f2cc60">Review: Runs\RUN_...\Phase_C_Analysis</text></g></g>
 <g filter="url(#shadow)"><rect x="880" y="170" width="450" height="120" rx="14" fill="#fff" stroke="#58a6ff" stroke-width="2"/><circle cx="908" cy="198" r="28" fill="#58a6ff"/><text x="908" y="206" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="945" y="206" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#58a6ff">Choose menu option 1</text><text x="905" y="236" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Do this before repairs.</text><text x="905" y="262" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">It establishes the 'before' evidence.</text></g>
 <line x1="880" y1="235" x2="745" y2="230" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="880" y="345" width="450" height="140" rx="14" fill="#fff" stroke="#8250df" stroke-width="2"/><circle cx="908" cy="373" r="28" fill="#8250df"/><text x="908" y="381" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="945" y="381" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#8250df">Let all three phases finish</text><text x="905" y="411" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Phase A = baseline</text><text x="905" y="437" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Phase B = detailed diagnostics</text><text x="905" y="463" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Phase C = findings + repair plan</text></g>
 <line x1="880" y1="420" x2="770" y2="425" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="880" y="545" width="450" height="120" rx="14" fill="#fff" stroke="#1f883d" stroke-width="2"/><circle cx="908" cy="573" r="28" fill="#1f883d"/><text x="908" y="581" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="945" y="581" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#1f883d">Do not close the window</text><text x="905" y="611" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Wait for the COMPLETE message.</text><text x="905" y="637" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Errors are logged instead of hidden.</text></g>
</svg>