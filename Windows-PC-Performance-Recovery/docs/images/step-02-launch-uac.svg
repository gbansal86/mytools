<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 2 — Start the toolkit and approve UAC</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">The launcher requests Administrator rights because some diagnostics and repairs require them.</text>
<g filter="url(#shadow)"><rect x="55" y="145" width="610" height="500" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
 <rect x="55" y="145" width="610" height="48" rx="14" fill="#eaeef2"/><text x="80" y="176" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#24292f">File Explorer — Windows-PC-Performance-Recovery</text>
 <g font-family="Segoe UI,Arial" font-size="18"><text x="95" y="245">📄 README.md</text><text x="95" y="290">📁 Toolkit</text><rect x="80" y="322" width="500" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="105" y="359" font-weight="700">⚙ 00_START_HERE.bat</text><text x="95" y="425">📁 Runs</text><text x="95" y="470">📁 History</text></g>
 <text x="95" y="560" font-family="Segoe UI,Arial" font-size="17" fill="#57606a">Double-click the highlighted BAT file.</text></g>
 <g filter="url(#shadow)"><rect x="745" y="150" width="590" height="360" rx="18" fill="#0b57d0"/><text x="790" y="205" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="white">User Account Control</text><text x="790" y="265" font-family="Segoe UI,Arial" font-size="22" fill="white">Do you want to allow this app</text><text x="790" y="298" font-family="Segoe UI,Arial" font-size="22" fill="white">to make changes to your device?</text><text x="790" y="355" font-family="Segoe UI,Arial" font-size="18" fill="white">Windows PowerShell</text><rect x="895" y="420" width="150" height="52" rx="7" fill="white"/><text x="949" y="453" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#0b57d0">Yes</text><rect x="1065" y="420" width="150" height="52" rx="7" fill="#e8f0fe"/><text x="1118" y="453" font-family="Segoe UI,Arial" font-size="19" fill="#0b57d0">No</text></g>
 <g filter="url(#shadow)"><rect x="745" y="555" width="275" height="115" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="773" cy="583" r="28" fill="#0969da"/><text x="773" y="591" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="810" y="591" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Double-click</text><text x="770" y="621" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Run 00_START_HERE.bat.</text></g>
 <line x1="745" y1="610" x2="575" y2="354" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="1040" y="555" width="295" height="115" rx="14" fill="#fff" stroke="#1f883d" stroke-width="2"/><circle cx="1068" cy="583" r="28" fill="#1f883d"/><text x="1068" y="591" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="1105" y="591" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#1f883d">Choose Yes</text><text x="1065" y="621" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Approve the UAC prompt.</text><text x="1065" y="647" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Otherwise full access is unavailable.</text></g>
 <line x1="1100" y1="555" x2="980" y2="470" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
