<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cf222e"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 7 — Apply the approved conservative repairs</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">Menu option 6 can change Windows. Use only after reviewing Step 5 and Step 6.</text>
<g filter="url(#shadow)"><rect x="55" y="145" width="790" height="520" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
 <g font-family="Consolas,monospace" font-size="18" fill="#c9d1d9"><rect x="85" y="195" width="680" height="58" rx="8" fill="#3b1618" stroke="#f85149" stroke-width="2"/><text x="105" y="233" fill="#f85149">6. APPLY repair plan (confirmation required)</text><text x="105" y="300">Choose: <tspan fill="#f85149">6</tspan></text><text x="105" y="365">Create restore point?  y/N</text><text x="105" y="405">Delete eligible old TEMP entries?  y/N</text><text x="105" y="445">Run DISM /RestoreHealth?  y/N</text><text x="105" y="485">Run SFC /scannow?  y/N</text><text x="105" y="545" fill="#f2cc60">Read each question before typing y.</text></g></g>
 <g filter="url(#shadow)"><rect x="895" y="165" width="440" height="130" rx="14" fill="#fff" stroke="#f85149" stroke-width="2"/><circle cx="923" cy="193" r="28" fill="#f85149"/><text x="923" y="201" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="960" y="201" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#f85149">Choose 6 only after dry run</text><text x="920" y="231" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">This phase can modify Windows.</text><text x="920" y="257" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Back up irreplaceable data first.</text></g>
 <line x1="895" y1="230" x2="770" y2="225" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="895" y="350" width="440" height="145" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="923" cy="378" r="28" fill="#0969da"/><text x="923" y="386" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="960" y="386" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Confirm one action at a time</text><text x="920" y="416" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Type y only for actions you approve.</text><text x="920" y="442" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">The tool logs what it performs.</text></g>
 <line x1="895" y1="420" x2="800" y2="425" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="895" y="550" width="440" height="105" rx="14" fill="#fff" stroke="#8250df" stroke-width="2"/><circle cx="923" cy="578" r="28" fill="#8250df"/><text x="923" y="586" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="960" y="586" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#8250df">Reboot if required</text><text x="920" y="616" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Restart before Step 8 if Windows/repair output asks for it.</text></g>
</svg>