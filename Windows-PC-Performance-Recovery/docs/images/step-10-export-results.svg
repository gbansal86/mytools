<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cf222e"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 10 — Export the latest run for deeper review</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">Menu option 9 creates a ZIP. Review it for private machine details before sharing.</text>
<g filter="url(#shadow)"><rect x="55" y="145" width="760" height="500" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
 <rect x="55" y="145" width="760" height="48" rx="14" fill="#eaeef2"/><text x="85" y="177" font-family="Segoe UI,Arial" font-size="18" font-weight="700">File Explorer — Windows-PC-Performance-Recovery</text>
 <g font-family="Segoe UI,Arial" font-size="18"><text x="95" y="245">📁 Runs</text><text x="125" y="290">📁 RUN_20260922_...</text><rect x="90" y="335" width="650" height="70" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="115" y="378" font-weight="700">🗜 RUN_20260922_..._FOR_REVIEW.zip</text></g>
 <rect x="90" y="455" width="650" height="120" rx="10" fill="#fff8c5" stroke="#9a6700"/><text x="115" y="493" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#9a6700">Privacy check before sharing:</text><text x="115" y="525" font-family="Segoe UI,Arial" font-size="17">computer name • usernames • paths • IP/MAC • device identifiers</text><text x="115" y="555" font-family="Segoe UI,Arial" font-size="17">Do not post private reports publicly without reviewing them.</text></g>
 <g filter="url(#shadow)"><rect x="875" y="170" width="455" height="120" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="903" cy="198" r="28" fill="#0969da"/><text x="903" y="206" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="940" y="206" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Choose menu option 9</text><text x="900" y="236" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">The newest run is compressed</text><text x="900" y="262" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">into one review ZIP.</text></g>
 <line x1="875" y1="230" x2="745" y2="365" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="875" y="360" width="455" height="130" rx="14" fill="#fff" stroke="#9a6700" stroke-width="2"/><circle cx="903" cy="388" r="28" fill="#9a6700"/><text x="903" y="396" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="940" y="396" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#9a6700">Review privacy first</text><text x="900" y="426" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Reports can contain machine/network</text><text x="900" y="452" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">identifiers even though passwords</text><text x="900" y="478" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">and tokens are not intended to be collected.</text></g>
 <line x1="875" y1="425" x2="745" y2="510" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="875" y="550" width="455" height="100" rx="14" fill="#fff" stroke="#1f883d" stroke-width="2"/><circle cx="903" cy="578" r="28" fill="#1f883d"/><text x="903" y="586" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="940" y="586" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#1f883d">Upload the ZIP for deeper analysis</text><text x="900" y="616" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Share the exported run, not random individual files.</text></g>
</svg>