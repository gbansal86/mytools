<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cf222e"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="820" fill="#f6f8fa"/>
<text x="55" y="58" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#24292f">Step 9 — Track hardware health over time</text>
<text x="55" y="92" font-family="Segoe UI,Arial" font-size="18" fill="#57606a">Menu option 8 combines snapshots from previous runs.</text>
<g filter="url(#shadow)"><rect x="55" y="145" width="780" height="510" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="85" y="190" font-family="Segoe UI,Arial" font-size="22" font-weight="700">Hardware Trend History</text>
 <line x1="125" y1="530" x2="700" y2="530" stroke="#8c959f" stroke-width="2"/><line x1="125" y1="250" x2="125" y2="530" stroke="#8c959f" stroke-width="2"/>
 <polyline points="145,470 250,455 355,420 460,365 565,310 680,245" fill="none" stroke="#cf222e" stroke-width="5"/>
 <g fill="#cf222e"><circle cx="145" cy="470" r="7"/><circle cx="250" cy="455" r="7"/><circle cx="355" cy="420" r="7"/><circle cx="460" cy="365" r="7"/><circle cx="565" cy="310" r="7"/><circle cx="680" cy="245" r="7"/></g>
 <text x="155" y="585" font-family="Segoe UI,Arial" font-size="17" fill="#57606a">Run 1</text><text x="620" y="585" font-family="Segoe UI,Arial" font-size="17" fill="#57606a">Later runs</text>
 <text x="155" y="225" font-family="Segoe UI,Arial" font-size="17" fill="#cf222e">Example: rising error/wear indicator</text></g>
 <g filter="url(#shadow)"><rect x="885" y="170" width="445" height="120" rx="14" fill="#fff" stroke="#bf3989" stroke-width="2"/><circle cx="913" cy="198" r="28" fill="#bf3989"/><text x="913" y="206" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="950" y="206" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#bf3989">Choose menu option 8</text><text x="910" y="236" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Run this after multiple scans.</text><text x="910" y="262" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">It creates History reports.</text></g>
 <g filter="url(#shadow)"><rect x="885" y="345" width="445" height="145" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="913" cy="373" r="28" fill="#0969da"/><text x="913" y="381" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="950" y="381" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Look for changes, not one number</text><text x="910" y="411" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Rising uncorrected errors, WHEA</text><text x="910" y="437" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">or wear indicators matter more</text><text x="910" y="463" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">than one isolated snapshot.</text></g>
 <line x1="885" y1="420" x2="700" y2="280" stroke="#cf222e" stroke-width="4" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="885" y="550" width="445" height="100" rx="14" fill="#fff" stroke="#cf222e" stroke-width="2"/><circle cx="913" cy="578" r="28" fill="#cf222e"/><text x="913" y="586" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="950" y="586" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#cf222e">Back up first if risk is rising</text><text x="910" y="616" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Do not stress-test a drive suspected of imminent failure.</text></g>
</svg>