 <g filter="url(#shadow)"><rect x="875" y="350" width="460" height="145" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="903" cy="378" r="28" fill="#0969da"/><text x="903" y="386" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">2</text><text x="940" y="386" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#0969da">Open comparison reports</text><text x="900" y="416" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Check BEFORE vs AFTER metrics</text><text x="900" y="442" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">and remaining findings.</text><text x="900" y="468" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Do not over-read tiny differences.</text></g>
