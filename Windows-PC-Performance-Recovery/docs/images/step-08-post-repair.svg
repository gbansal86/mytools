 <g filter="url(#shadow)"><rect x="875" y="550" width="460" height="100" rx="14" fill="#fff" stroke="#1f883d" stroke-width="2"/><circle cx="903" cy="578" r="28" fill="#1f883d"/><text x="903" y="586" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">3</text><text x="940" y="586" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#1f883d">Success = measured improvement</text><text x="900" y="616" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">The goal is evidence, not an arbitrary 'PC score'.</text></g>
