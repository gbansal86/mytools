 <g font-family="Consolas,monospace" font-size="19" fill="#c9d1d9"><rect x="85" y="200" width="650" height="58" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="2"/><text x="105" y="238" fill="#d2a8ff">7. Post-repair retest + comparison</text><text x="105" y="310">Choose: <tspan fill="#d2a8ff">7</tspan></text><text x="105" y="375">Re-running baseline...</text><text x="105" y="410">Re-running diagnostics...</text><text x="105" y="445">Building before/after comparison...</text><text x="105" y="510" fill="#3fb950">FINAL_EXECUTIVE_REPORT.txt created</text><text x="105" y="545" fill="#3fb950">BEFORE_AFTER_COMPARISON.txt created</text></g></g>
 <g filter="url(#shadow)"><rect x="875" y="165" width="460" height="130" rx="14" fill="#fff" stroke="#8250df" stroke-width="2"/><circle cx="903" cy="193" r="28" fill="#8250df"/><text x="903" y="201" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">1</text><text x="940" y="201" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#8250df">Choose 7</text><text x="900" y="231" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Run after repairs and reboot.</text><text x="900" y="257" font-family="Segoe UI,Arial" font-size="17" fill="#24292f">Try to use a similar workload.</text></g>
