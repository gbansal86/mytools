<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><rect width="1400" height="520" fill="#ffffff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e7781"/></marker></defs><text x="55" y="55" font-family="Segoe UI,Arial" font-size="32" font-weight="700" fill="#24292f">Evidence-first workflow</text><g font-family="Segoe UI,Arial">
<g transform="translate(50,115)"><rect width="150" height="105" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#0969da">A</text><text x="50" y="38" font-size="21" font-weight="700">Baseline</text><text x="20" y="70" font-size="15">Measure first</text><text x="20" y="92" font-size="15">No repair</text></g>
<g transform="translate(235,115)"><rect width="150" height="105" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#1a7f37">B</text><text x="50" y="38" font-size="21" font-weight="700">Diagnose</text><text x="20" y="70" font-size="15">Hardware +</text><text x="20" y="92" font-size="15">Windows evidence</text></g>
<g transform="translate(420,115)"><rect width="150" height="105" rx="14" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#9a6700">C</text><text x="50" y="38" font-size="21" font-weight="700">Analyze</text><text x="20" y="70" font-size="15">Findings +</text><text x="20" y="92" font-size="15">repair plan</text></g>
<g transform="translate(605,115)"><rect width="150" height="105" rx="14" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#bc4c00">D</text><text x="50" y="38" font-size="21" font-weight="700">Repair</text><text x="20" y="70" font-size="15">Dry run first</text><text x="20" y="92" font-size="15">Then confirm</text></g>
<g transform="translate(790,115)"><rect width="150" height="105" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#8250df">E</text><text x="50" y="38" font-size="21" font-weight="700">Re-test</text><text x="20" y="70" font-size="15">Repeat similar</text><text x="20" y="92" font-size="15">measurements</text></g>
<g transform="translate(975,115)"><rect width="150" height="105" rx="14" fill="#eaeef2" stroke="#57606a" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#57606a">F</text><text x="50" y="38" font-size="21" font-weight="700">Compare</text><text x="20" y="70" font-size="15">Before vs</text><text x="20" y="92" font-size="15">after</text></g>
<g transform="translate(1160,115)"><rect width="150" height="105" rx="14" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/><text x="20" y="38" font-size="24" font-weight="700" fill="#bf3989">G</text><text x="50" y="38" font-size="21" font-weight="700">Trend</text><text x="20" y="70" font-size="15">Track hardware</text><text x="20" y="92" font-size="15">over time</text></g>
<g stroke="#6e7781" stroke-width="3" marker-end="url(#arr)"><line x1="200" y1="168" x2="225" y2="168"/><line x1="385" y1="168" x2="410" y2="168"/><line x1="570" y1="168" x2="595" y2="168"/><line x1="755" y1="168" x2="780" y2="168"/><line x1="940" y1="168" x2="965" y2="168"/><line x1="1125" y1="168" x2="1150" y2="168"/></g>
<rect x="75" y="290" width="1250" height="145" rx="15" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="105" y="330" font-size="21" font-weight="700" fill="#cf222e">Hardware warning rule</text><text x="105" y="365" font-size="18" fill="#24292f">If storage/WHEA/memory evidence suggests physical failure, prioritize backup + hardware investigation.</text><text x="105" y="397" font-size="18" fill="#24292f">Do not mistake a script's inability to read a sensor/SMART attribute for proof that the component is healthy.</text></g></svg>