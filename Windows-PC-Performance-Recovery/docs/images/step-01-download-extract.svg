 <rect x="615" y="215" width="165" height="48" rx="8" fill="#1f883d"/><text x="663" y="246" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="white">Code ▼</text>
 <rect x="570" y="278" width="230" height="130" rx="10" fill="white" stroke="#d0d7de"/><text x="595" y="320" font-family="Segoe UI,Arial" font-size="18" fill="#24292f">Clone</text><rect x="592" y="342" width="185" height="42" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="610" y="369" font-family="Segoe UI,Arial" font-size="17" fill="#0969da">Download ZIP</text>
 <text x="85" y="455" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#24292f">After download:</text><text x="110" y="495" font-family="Segoe UI,Arial" font-size="18">Right-click ZIP → Extract All...</text><text x="110" y="530" font-family="Segoe UI,Arial" font-size="18">Open: Windows-PC-Performance-Recovery</text>
