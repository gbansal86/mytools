<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">

<style>
  .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d8e0ec;stroke-width:2}
  .top{fill:#17213a}.title{font:700 38px Arial,sans-serif;fill:#fff}
  .sub{font:20px Arial,sans-serif;fill:#dbe5ff}
  .h{font:700 24px Arial,sans-serif;fill:#14213d}.t{font:18px Arial,sans-serif;fill:#334155}
  .small{font:16px Arial,sans-serif;fill:#475569}.mono{font:18px Consolas,monospace;fill:#e2e8f0}
  .num{fill:#2563eb}.numt{font:700 24px Arial,sans-serif;fill:#fff;text-anchor:middle}
  .hi{fill:#fff4bf;stroke:#f2b705;stroke-width:3}.ok{fill:#eaf8ef;stroke:#22a35a;stroke-width:2}
  .warn{fill:#fff5e8;stroke:#f59e0b;stroke-width:2}.code{fill:#111827;stroke:#334155;stroke-width:2}
  .blue{fill:#2563eb}.green{fill:#159447}.red{fill:#dc3545}.muted{fill:#64748b}
  .arrow{stroke:#f2b705;stroke-width:7;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f2b705"/></marker></defs>
<rect class="bg" width="1400" height="800"/><rect class="top" width="1400" height="120"/>
<text class="title" x="42" y="55">Step 1 — Enable ADB local connection in LDPlayer</text>
<text class="sub" x="42" y="91">Required so the repair tool can communicate with Android inside LDPlayer.</text>
<rect class="panel" x="35" y="150" width="940" height="585" rx="18"/>
<rect fill="#202634" x="60" y="177" width="890" height="530" rx="12"/>
<text x="85" y="220" style="font:700 28px Arial;fill:white">Settings</text>
<rect fill="#2d3445" x="80" y="250" width="220" height="410" rx="8"/>
<text class="small" x="105" y="300" style="fill:#dbe5ff">Display</text>
<text class="small" x="105" y="348" style="fill:#dbe5ff">Advanced</text>
<text class="small" x="105" y="396" style="fill:#dbe5ff">Model</text>
<text class="small" x="105" y="444" style="fill:#dbe5ff">Disk</text>
<text class="small" x="105" y="492" style="fill:#dbe5ff">Audio</text>
<text class="small" x="105" y="540" style="fill:#dbe5ff">Network</text>
<rect class="hi" x="91" y="583" width="198" height="52" rx="8"/>
<text class="h" x="120" y="617">Others</text>
<text x="345" y="242" style="font:700 31px Arial;fill:#fff">Other settings</text>
<text class="small" x="350" y="315" style="fill:#dbe5ff">Run on PC startup</text>
<text class="small" x="350" y="365" style="fill:#dbe5ff">Root permission</text>
<text class="small" x="350" y="415" style="fill:#dbe5ff">Tab</text>
<text class="small" x="350" y="465" style="fill:#dbe5ff">Mouse right-click</text>
<text class="small" x="350" y="515" style="fill:#dbe5ff">Disable mouse acceleration</text>
<rect class="hi" x="335" y="552" width="540" height="60" rx="8"/>
<text class="h" x="355" y="590">ADB debugging</text>
<rect fill="#30394d" stroke="#f2b705" stroke-width="3" x="635" y="561" width="224" height="42" rx="6"/>
<text x="658" y="588" style="font:700 18px Arial;fill:#fff">Enable local connection</text>
<circle class="num" cx="1035" cy="235" r="31"/><text class="numt" x="1035" y="244">1</text>
<text class="h" x="1085" y="242">Open Settings</text>
<circle class="num" cx="1035" cy="335" r="31"/><text class="numt" x="1035" y="344">2</text>
<text class="h" x="1085" y="342">Choose Others</text>
<circle class="num" cx="1035" cy="435" r="31"/><text class="numt" x="1035" y="444">3</text>
<text class="h" x="1085" y="442">Find ADB debugging</text>
<circle class="num" cx="1035" cy="535" r="31"/><text class="numt" x="1035" y="544">4</text>
<text class="h" x="1085" y="527">Select:</text><text x="1085" y="558" style="font:700 22px Arial;fill:#2563eb">Enable local connection</text>
<path class="arrow" d="M1070 560 C1000 590,950 585,875 585"/>
<rect class="ok" x="995" y="625" width="365" height="86" rx="12"/>
<text class="h" x="1018" y="660" style="fill:#137a42">Save / restart LDPlayer</text>
<text class="small" x="1018" y="689">if LDPlayer asks you to.</text>
</svg>