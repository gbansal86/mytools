<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">

<style>
  .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d8e0ec;stroke-width:2}
  .top{fill:#17213a}.title{font:700 38px Arial,sans-serif;fill:#fff}
  .sub{font:20px Arial,sans-serif;fill:#dbe5ff}
  .h{font:700 24px Arial,sans-serif;fill:#14213d}.t{font:18px Arial,sans-serif;fill:#334155}
  .small{font:16px Arial,sans-serif;fill:#475569}.mono{font:18px Consolas,monospace;fill:#e2e8f0}
  .num{fill:#2563eb}.numt{font:700 24px Arial,sans-serif;fill:#fff;text-anchor:middle}
  .hi{fill:#fff4bf;stroke:#f2b705;stroke-width:3}.ok{fill:#eaf8ef;stroke:#22a35a;stroke-width:2}
  .warn{fill:#fff5e8;stroke:#f59e0b;stroke-width:2}.code{fill:#111827;stroke:#334155;stroke-width:2}
  .blue{fill:#2563eb}.green{fill:#159447}.red{fill:#dc3545}.muted{fill:#64748b}
  .arrow{stroke:#f2b705;stroke-width:7;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f2b705"/></marker></defs>
<rect class="bg" width="1400" height="800"/><rect class="top" width="1400" height="120"/>
<text class="title" x="42" y="55">Step 2 — Verify that ADB can see LDPlayer</text>
<text class="sub" x="42" y="91">This confirms the PC can communicate with the running Android emulator.</text>
<rect class="panel" x="40" y="155" width="1320" height="580" rx="18"/>
<circle class="num" cx="90" cy="210" r="30"/><text class="numt" x="90" y="219">1</text>
<text class="h" x="135" y="218">Keep LDPlayer open and fully booted.</text>
<circle class="num" cx="90" cy="290" r="30"/><text class="numt" x="90" y="299">2</text>
<text class="h" x="135" y="298">Open Command Prompt</text><text class="t" x="475" y="298">Windows key → type</text><text x="655" y="298" style="font:700 20px Consolas;fill:#2563eb">cmd</text>
<circle class="num" cx="90" cy="375" r="30"/><text class="numt" x="90" y="384">3</text>
<text class="h" x="135" y="383">Run:</text>
<rect class="code" x="245" y="335" width="970" height="78" rx="10"/>
<text class="mono" x="270" y="383">"C:\LDPlayer\LDPlayer9\adb.exe" devices</text>
<circle class="num" cx="90" cy="480" r="30"/><text class="numt" x="90" y="489">4</text>
<text class="h" x="135" y="488">Look for the word</text><text x="355" y="488" style="font:700 24px Arial;fill:#159447">device</text>
<rect class="code" x="135" y="520" width="785" height="150" rx="10"/>
<text class="mono" x="165" y="565">List of devices attached</text>
<text class="mono" x="165" y="615">emulator-5554      </text><rect class="ok" x="360" y="580" width="120" height="48" rx="8"/>
<text x="380" y="612" style="font:700 21px Consolas;fill:#159447">device</text>
<rect class="ok" x="955" y="520" width="360" height="150" rx="12"/>
<text class="h" x="985" y="561" style="fill:#137a42">ADB is working</text>
<text class="t" x="985" y="600">The emulator number can differ.</text>
<text class="t" x="985" y="632">The important part is “device”.</text>
<rect class="warn" x="955" y="185" width="360" height="245" rx="12"/>
<text class="h" x="985" y="225">If the list is empty</text>
<text class="t" x="985" y="266">Re-check:</text>
<text class="small" x="985" y="300">Settings → Others</text>
<text class="small" x="985" y="330">→ ADB debugging</text>
<text class="small" x="985" y="360">→ Enable local connection</text>
<text class="small" x="985" y="400">Then restart LDPlayer and retry.</text>
</svg>