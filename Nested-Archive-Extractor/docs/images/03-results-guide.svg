<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}.title{font-size:40px;font-weight:700;fill:white}.sub{font-size:22px;fill:#eaf4ff}.h{font-size:26px;font-weight:700}.t{font-size:20px}.mono{font-family:Consolas,monospace;font-size:19px}.num{font-size:22px;font-weight:700;fill:white}.callh{font-size:22px;font-weight:700}.call{font-size:19px}
</style>
<rect width="1500" height="860" fill="#f6f9fc"/>
<rect width="1500" height="110" fill="#145da0"/>
<text x="40" y="54" class="title">Step 3: Read the Results and Find Your Files</text>
<text x="40" y="88" class="sub">The live pane tells you what happened; the same information is saved as a TXT report.</text>

<rect x="55" y="155" width="900" height="570" rx="14" fill="white" stroke="#93a9bd" stroke-width="2"/>
<text x="85" y="205" class="h">Example results pane</text>
<rect x="85" y="235" width="840" height="410" fill="#fbfcfd" stroke="#95a8b8" stroke-width="2"/>
<text x="105" y="275" class="mono">[08:40:30] START  | Destination: E:\Extracted</text>
<text x="105" y="315" class="mono">[08:40:30] REPORT | E:\Extracted\Nested_Extraction_Report_....txt</text>
<text x="105" y="355" class="mono">[08:40:30] FOUND  | 2 outer archive(s)</text>
<text x="105" y="395" class="mono">[08:40:30] OUTER  | D:\Downloads\course.zst -&gt; E:\Extracted\course</text>
<text x="105" y="435" class="mono">[08:40:34] UNWRAP | Single inner archive detected; continuing directly.</text>
<text x="105" y="475" class="mono">[08:40:39] NESTED | ... inner archive ...</text>
<text x="105" y="515" class="mono">[08:41:10] FILE   | E:\Extracted\course\lesson1.mp4</text>
<text x="105" y="555" class="mono">[08:41:10] OK     | D:\Downloads\course.zst</text>
<text x="105" y="595" class="mono">[08:41:10] DONE   | Successful outer: 1 | Incomplete outer: 0 | ...</text>

<rect x="85" y="670" width="840" height="38" rx="6" fill="#eaf7ee"/>
<text x="105" y="696" class="t">If DONE shows Failures: 0 and Incomplete outer: 0, the full nested chain completed.</text>

<rect x="995" y="155" width="450" height="120" rx="12" fill="white" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1033" cy="196" r="23" fill="#145da0"/><text x="1026" y="204" class="num">1</text>
<text x="1070" y="190" class="callh">Watch the live pane</text>
<text x="1070" y="222" class="call">OUTER and NESTED show which</text>
<text x="1070" y="250" class="call">archive layer is being processed.</text>

<rect x="995" y="295" width="450" height="135" rx="12" fill="white" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1033" cy="336" r="23" fill="#145da0"/><text x="1026" y="344" class="num">2</text>
<text x="1070" y="330" class="callh">Check the final status</text>
<text x="1070" y="362" class="call">OK = nested extraction completed.</text>
<text x="1070" y="390" class="call">PARTIAL/FAILED = review the report.</text>

<rect x="995" y="450" width="450" height="135" rx="12" fill="#fff8e1" stroke="#d2ad45" stroke-width="2"/>
<circle cx="1033" cy="491" r="23" fill="#e59b22"/><text x="1026" y="499" class="num">3</text>
<text x="1070" y="485" class="callh">If you see RECOVER</text>
<text x="1070" y="517" class="call">The temporary workspace was kept</text>
<text x="1070" y="545" class="call">so failed/intermediate files can be inspected.</text>

<rect x="995" y="605" width="450" height="120" rx="12" fill="#eaf7ee" stroke="#75ae84" stroke-width="2"/>
<circle cx="1033" cy="646" r="23" fill="#4b9b61"/><text x="1026" y="654" class="num">4</text>
<text x="1070" y="640" class="callh">Open the output folder</text>
<text x="1070" y="672" class="call">Your final extracted files are under</text>
<text x="1070" y="700" class="call">the destination selected in Step 2.</text>

<rect x="55" y="760" width="1390" height="62" rx="10" fill="#e9f2fb"/>
<text x="80" y="798" class="t">Tip: keep the TXT report when troubleshooting; it contains the exact archive paths and status messages.</text>
</svg>