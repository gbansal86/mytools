<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}.title{font-size:40px;font-weight:700;fill:white}.sub{font-size:22px;fill:#eaf4ff}.label{font-size:19px;font-weight:700}.ui{font-size:18px}.btn{font-size:18px;font-weight:600}.num{font-size:23px;font-weight:700;fill:white}.callh{font-size:23px;font-weight:700}.call{font-size:19px}.mono{font-family:Consolas,monospace;font-size:16px}
</style>
<rect width="1600" height="1020" fill="#f6f9fc"/>
<rect width="1600" height="110" fill="#145da0"/>
<text x="40" y="54" class="title">Step 2: Choose What to Extract and Where to Save It</text>
<text x="40" y="88" class="sub">This diagram mirrors the controls in the current v3 PowerShell GUI.</text>

<!-- GUI window -->
<rect x="40" y="145" width="980" height="805" rx="14" fill="white" stroke="#8ba5bc" stroke-width="2"/>
<rect x="40" y="145" width="980" height="48" rx="14" fill="#edf3f8"/>
<text x="65" y="177" class="label">Nested Archive Extractor v3</text>
<text x="65" y="228" style="font-size:25px;font-weight:700">Extract archives inside archives automatically</text>
<text x="65" y="260" class="ui">Add files/folders or paste one full path per line. Original archives stay untouched.</text>

<text x="65" y="305" class="label">INPUT FILES / FOLDERS</text>
<rect x="65" y="320" width="700" height="135" fill="#fff" stroke="#9caebf" stroke-width="2"/>
<text x="82" y="355" class="mono">D:\Downloads\course-one.zst</text>
<text x="82" y="385" class="mono">D:\Downloads\archive-with-no-extension</text>
<rect x="785" y="320" width="205" height="38" rx="5" fill="#edf2f6" stroke="#9caebf"/><text x="848" y="345" class="btn">Add files...</text>
<rect x="785" y="369" width="205" height="38" rx="5" fill="#edf2f6" stroke="#9caebf"/><text x="842" y="394" class="btn">Add folder...</text>
<rect x="785" y="418" width="205" height="38" rx="5" fill="#edf2f6" stroke="#9caebf"/><text x="845" y="443" class="btn">Clear paths</text>

<text x="65" y="500" class="label">OUTPUT FOLDER</text>
<rect x="65" y="516" width="700" height="38" fill="#fff" stroke="#9caebf" stroke-width="2"/>
<text x="82" y="542" class="mono">E:\Extracted</text>
<rect x="785" y="516" width="205" height="38" rx="5" fill="#edf2f6" stroke="#9caebf"/><text x="852" y="542" class="btn">Browse...</text>

<text x="65" y="598" class="label">7-ZIP EXECUTABLE</text>
<rect x="65" y="614" width="700" height="38" fill="#fff" stroke="#9caebf" stroke-width="2"/>
<text x="82" y="640" class="mono">C:\Program Files\7-Zip\7z.exe</text>
<rect x="785" y="614" width="205" height="38" rx="5" fill="#edf2f6" stroke="#9caebf"/><text x="820" y="640" class="btn">Browse 7z.exe...</text>

<rect x="65" y="690" width="20" height="20" fill="white" stroke="#607d8b" stroke-width="2"/>
<path d="M69 699 l5 6 l11 -15" fill="none" stroke="#1976d2" stroke-width="3"/>
<text x="95" y="707" class="ui">Include subfolders when input is a folder</text>
<text x="555" y="707" class="ui">Maximum archive nesting:</text>
<rect x="790" y="681" width="80" height="35" fill="white" stroke="#9caebf"/><text x="820" y="705" class="ui">8</text>

<rect x="65" y="750" width="210" height="46" rx="5" fill="#e7f4e9" stroke="#4b9b61" stroke-width="2"/>
<text x="90" y="779" class="btn">START EXTRACTION</text>
<rect x="290" y="750" width="265" height="46" rx="5" fill="#edf2f6" stroke="#9caebf"/>
<text x="315" y="779" class="btn">Cancel after current archive</text>
<rect x="570" y="750" width="185" height="46" rx="5" fill="#edf2f6" stroke="#9caebf"/>
<text x="594" y="779" class="btn">Clear results pane</text>
<text x="65" y="838" class="ui">Ready.</text>
<rect x="65" y="858" width="925" height="72" fill="#fbfcfd" stroke="#9caebf"/>
<text x="80" y="885" class="mono">Results and extraction messages appear here.</text>

<!-- Number highlights -->
<circle cx="56" cy="350" r="23" fill="#e53935"/><text x="49" y="358" class="num">1</text>
<circle cx="56" cy="535" r="23" fill="#e53935"/><text x="49" y="543" class="num">2</text>
<circle cx="56" cy="633" r="23" fill="#e53935"/><text x="49" y="641" class="num">3</text>
<circle cx="56" cy="700" r="23" fill="#e53935"/><text x="49" y="708" class="num">4</text>
<circle cx="56" cy="773" r="23" fill="#e53935"/><text x="49" y="781" class="num">5</text>

<!-- callouts -->
<rect x="1060" y="155" width="500" height="135" rx="12" fill="#fff" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1100" cy="200" r="24" fill="#e53935"/><text x="1093" y="208" class="num">1</text>
<text x="1140" y="194" class="callh">Add files or a folder</text>
<text x="1140" y="225" class="call">Choose individual archives, a whole folder,</text>
<text x="1140" y="253" class="call">or paste paths. Extensionless files are allowed.</text>

<rect x="1060" y="310" width="500" height="120" rx="12" fill="#fff" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1100" cy="350" r="24" fill="#e53935"/><text x="1093" y="358" class="num">2</text>
<text x="1140" y="344" class="callh">Choose the destination</text>
<text x="1140" y="376" class="call">For very long archive names, a short path such as</text>
<text x="1140" y="404" class="call">E:\Extracted can reduce Windows path issues.</text>

<rect x="1060" y="450" width="500" height="120" rx="12" fill="#fff" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1100" cy="490" r="24" fill="#e53935"/><text x="1093" y="498" class="num">3</text>
<text x="1140" y="484" class="callh">Check 7-Zip</text>
<text x="1140" y="516" class="call">The tool normally finds 7z.exe automatically.</text>
<text x="1140" y="544" class="call">Use Browse if the box is empty or incorrect.</text>

<rect x="1060" y="590" width="500" height="145" rx="12" fill="#fff" stroke="#c5d6e5" stroke-width="2"/>
<circle cx="1100" cy="630" r="24" fill="#e53935"/><text x="1093" y="638" class="num">4</text>
<text x="1140" y="624" class="callh">Set scan options</text>
<text x="1140" y="656" class="call">Keep subfolders checked for folder scans.</text>
<text x="1140" y="684" class="call">Maximum nesting = how many archive-inside-archive</text>
<text x="1140" y="712" class="call">levels the program is allowed to follow.</text>

<rect x="1060" y="755" width="500" height="150" rx="12" fill="#eaf7ee" stroke="#75ae84" stroke-width="2"/>
<circle cx="1100" cy="800" r="24" fill="#e53935"/><text x="1093" y="808" class="num">5</text>
<text x="1140" y="794" class="callh">Click START EXTRACTION</text>
<text x="1140" y="826" class="call">The lower pane shows progress. A permanent TXT</text>
<text x="1140" y="854" class="call">report is also saved in the output folder.</text>
</svg>