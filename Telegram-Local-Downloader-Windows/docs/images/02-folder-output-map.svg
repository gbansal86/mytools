<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Telegram Local Downloader folder and output map</title><desc id="desc">Numbered diagram showing public source files and private runtime output folders.</desc>
<rect width="1200" height="620" fill="#f8fafc"/><g font-family="Segoe UI,Arial"><text x="55" y="55" fill="#0f172a" font-size="30" font-weight="700">Where everything goes</text><text x="55" y="88" fill="#475569" font-size="18">Blue = source/config you can publish. Red = personal/runtime data to keep private.</text>
<rect x="55" y="125" width="500" height="430" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="85" y="165" fill="#0c4a6e" font-size="23" font-weight="700">1  Public source package</text>
<g fill="#0f172a" font-size="17"><text x="90" y="205">├─ START_DOWNLOAD.bat</text><text x="90" y="237">├─ telegram_download.py</text><text x="90" y="269">├─ channel_html_export.py</text><text x="90" y="301">├─ download_options.json</text><text x="90" y="333">├─ channels.example.txt</text><text x="90" y="365">├─ telegram_settings.example.json</text><text x="90" y="397">├─ PREPUBLISH_CHECK.bat</text><text x="90" y="429">├─ README / START_HERE / SECURITY</text><text x="90" y="461">└─ LICENSE (MIT)</text></g>
<rect x="645" y="125" width="500" height="430" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="675" y="165" fill="#7f1d1d" font-size="23" font-weight="700">2  Private runtime data</text>
<g fill="#0f172a" font-size="17"><text x="680" y="205">├─ channels.txt</text><text x="680" y="237">├─ telegram_settings.json</text><text x="680" y="269">├─ telegram_session.session</text><text x="680" y="301">├─ download_report.csv</text><text x="680" y="333">├─ downloads/</text><text x="720" y="365">│  └─ Channel/Videos + Documents</text><text x="680" y="397">└─ channel_exports/</text><text x="720" y="429">   └─ index.html + messages.jsonl</text></g>
<text x="675" y="505" fill="#991b1b" font-size="15" font-weight="700">The included .gitignore is designed to block these.</text>
<rect x="55" y="575" width="1090" height="1" fill="#cbd5e1"/><text x="55" y="604" fill="#475569" font-size="15">3  Before every public push: run PREPUBLISH_CHECK.bat and inspect git status --short.</text></g></svg>
