<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Telegram Local Downloader first-run workflow</title>
<desc id="desc">Six numbered steps from Telegram developer credentials to downloaded files and offline archive.</desc>
<rect width="1200" height="420" fill="#0f172a"/>
<text x="60" y="55" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">First run — what happens</text>
<text x="60" y="88" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="18">Follow the numbered boxes from left to right.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/></marker></defs>
<g font-family="Segoe UI,Arial">
<g transform="translate(45 130)"><rect width="165" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">1</text><text x="20" y="78" fill="#f8fafc" font-size="18" font-weight="700">Get API ID/hash</text><text x="20" y="106" fill="#cbd5e1" font-size="14">my.telegram.org</text><text x="20" y="132" fill="#fca5a5" font-size="13">Keep hash private</text></g>
<line x1="215" y1="210" x2="248" y2="210" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(255 130)"><rect width="165" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">2</text><text x="20" y="78" fill="#f8fafc" font-size="18" font-weight="700">Create channels.txt</text><text x="20" y="106" fill="#cbd5e1" font-size="14">One channel per line</text><text x="20" y="132" fill="#fca5a5" font-size="13">Keep private by default</text></g>
<line x1="425" y1="210" x2="458" y2="210" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(465 130)"><rect width="165" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">3</text><text x="20" y="78" fill="#f8fafc" font-size="18" font-weight="700">Run BAT</text><text x="20" y="106" fill="#cbd5e1" font-size="14">START_DOWNLOAD.bat</text><text x="20" y="132" fill="#cbd5e1" font-size="13">Creates .venv + Telethon</text></g>
<line x1="635" y1="210" x2="668" y2="210" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(675 130)"><rect width="165" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">4</text><text x="20" y="78" fill="#f8fafc" font-size="18" font-weight="700">Telegram sign-in</text><text x="20" y="106" fill="#cbd5e1" font-size="14">Verification / 2FA</text><text x="20" y="132" fill="#fca5a5" font-size="13">Session stays local</text></g>
<line x1="845" y1="210" x2="878" y2="210" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(885 130)"><rect width="165" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">5</text><text x="20" y="78" fill="#f8fafc" font-size="18" font-weight="700">Scan + download</text><text x="20" y="106" fill="#cbd5e1" font-size="14">Videos / documents</text><text x="20" y="132" fill="#cbd5e1" font-size="13">Existing complete files skip</text></g>
<line x1="1055" y1="210" x2="1088" y2="210" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(1095 130)"><rect width="85" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="20" fill="#38bdf8"/><text x="30" y="37" text-anchor="middle" fill="#082f49" font-size="20" font-weight="700">6</text><text x="12" y="78" fill="#f8fafc" font-size="15" font-weight="700">Review</text><text x="12" y="104" fill="#cbd5e1" font-size="12">CSV +</text><text x="12" y="124" fill="#cbd5e1" font-size="12">HTML</text></g>
<rect x="45" y="330" width="1135" height="45" rx="10" fill="#172554"/><text x="65" y="359" fill="#bfdbfe" font-size="16">Nothing in this workflow gives access to a channel your Telegram account cannot already access.</text>
</g></svg>
