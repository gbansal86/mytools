<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Private versus public data safety guide</title><desc id="desc">Annotated data flow showing safe-to-publish source code and data that must stay local.</desc>
<rect width="1200" height="470" fill="#111827"/><g font-family="Segoe UI,Arial"><text x="55" y="55" fill="#f9fafb" font-size="30" font-weight="700">What may go to GitHub — and what must stay on your PC</text>
<rect x="55" y="105" width="460" height="290" rx="18" fill="#052e16" stroke="#22c55e" stroke-width="2"/><circle cx="100" cy="150" r="25" fill="#22c55e"/><text x="100" y="158" text-anchor="middle" fill="#052e16" font-size="23" font-weight="700">1</text><text x="145" y="158" fill="#dcfce7" font-size="23" font-weight="700">Safe public source</text>
<g fill="#bbf7d0" font-size="17"><text x="90" y="210">✓ Python/BAT source code</text><text x="90" y="245">✓ Example configuration only</text><text x="90" y="280">✓ Documentation and diagrams</text><text x="90" y="315">✓ .gitignore / privacy checker</text><text x="90" y="350">✓ MIT LICENSE</text></g>
<rect x="685" y="105" width="460" height="290" rx="18" fill="#450a0a" stroke="#ef4444" stroke-width="2"/><circle cx="730" cy="150" r="25" fill="#ef4444"/><text x="730" y="158" text-anchor="middle" fill="#450a0a" font-size="23" font-weight="700">2</text><text x="775" y="158" fill="#fee2e2" font-size="23" font-weight="700">Keep local / private</text>
<g fill="#fecaca" font-size="17"><text x="720" y="210">✗ API hash / credential file</text><text x="720" y="245">✗ Telegram session file</text><text x="720" y="280">✗ Real channel list</text><text x="720" y="315">✗ Download/report history</text><text x="720" y="350">✗ Downloaded media / archives</text></g>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#fbbf24"/></marker></defs><line x1="530" y1="250" x2="665" y2="250" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/><text x="535" y="225" fill="#fde68a" font-size="15">Do not copy runtime data</text>
<rect x="55" y="420" width="1090" height="1" fill="#374151"/><text x="55" y="451" fill="#d1d5db" font-size="16">3  If a secret was ever committed, removing the latest file is not enough: purge Git history and rotate/revoke the exposed credential/session.</text></g></svg>
