<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><style>.bg{fill:#f6f8fc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 23px Segoe UI,Arial;fill:#172033;text-anchor:middle}.t{font:15px Segoe UI,Arial;fill:#475467;text-anchor:middle}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}.tag{fill:#e8efff;stroke:#93b4ff;stroke-width:1}.safe{fill:#e7f8ef;stroke:#75d5a5;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="bg" width="1500" height="900"/><text x="750" y="60" text-anchor="middle" style="font:700 32px Segoe UI,Arial;fill:#172033">Course Library Manager — how the pieces fit together</text><rect class="box" x="70" y="150" width="280" height="180" rx="18"/><text class="h" x="210" y="200">Your course folders</text><text class="t" x="210" y="240">Videos · SRT/VTT · PDFs</text><text class="t" x="210" y="268">Images · Documents · Sections</text><rect class="tag" x="115" y="290" width="190" height="28" rx="14"/><text class="t" x="210" y="309">Original source files</text><rect class="box" x="470" y="105" width="300" height="225" rx="18"/><text class="h" x="620" y="155">PowerShell GUI</text><text class="t" x="620" y="195">Choose root · Settings · Activity</text><text class="t" x="620" y="223">One-window launcher</text><text class="t" x="620" y="251">Compatibility self-test</text><rect class="safe" x="525" y="280" width="190" height="30" rx="15"/><text class="t" x="620" y="300">No telemetry</text><rect class="box" x="880" y="105" width="260" height="225" rx="18"/><text class="h" x="1010" y="155">Folder cleanup</text><text class="t" x="1010" y="195">Preview CSV</text><text class="t" x="1010" y="223">Apply safe renames</text><text class="t" x="1010" y="251">Collision checks</text><text class="t" x="1010" y="279">Undo JSON</text><rect class="box" x="1180" y="105" width="250" height="225" rx="18"/><text class="h" x="1305" y="155">Optional FFmpeg</text><text class="t" x="1305" y="195">ffprobe → duration</text><text class="t" x="1305" y="223">ffmpeg → thumbnails</text><text class="t" x="1305" y="251">Portable local install</text><text class="t" x="1305" y="279">Progress · timeout · fallback</text><rect class="box" x="470" y="450" width="300" height="220" rx="18"/><text class="h" x="620" y="500">Catalog generator</text><text class="t" x="620" y="540">Recursive scan</text><text class="t" x="620" y="568">SRT → generated VTT</text><text class="t" x="620" y="596">JSON metadata</text><text class="t" x="620" y="624">Static HTML + JavaScript</text><rect class="box" x="900" y="450" width="330" height="220" rx="18"/><text class="h" x="1065" y="500">_CourseLibrary output</text><text class="t" x="1065" y="540">index.html</text><text class="t" x="1065" y="568">library-data.json</text><text class="t" x="1065" y="596">assets/thumbs</text><text class="t" x="1065" y="624">assets/vtt</text><rect class="box" x="900" y="735" width="330" height="120" rx="18"/><text class="h" x="1065" y="780">Local browser</text><text class="t" x="1065" y="815">Search · Play · Seek · Speed · Resume</text><path class="a" d="M350 240 L455 200"/><path class="a" d="M770 190 L865 190"/><path class="a" d="M770 230 L1165 230"/><path class="a" d="M620 330 L620 435"/><path class="a" d="M770 560 L885 560"/><path class="a" d="M1065 670 L1065 720"/><path class="a" d="M350 275 C410 350,420 510,455 540"/><rect class="safe" x="85" y="745" width="660" height="110" rx="18"/><text x="415" y="785" text-anchor="middle" style="font:700 21px Segoe UI,Arial;fill:#14532d">Safety boundary</text><text class="t" x="415" y="818">Catalog generation leaves original videos/resources in place.</text><text class="t" x="415" y="842">Folder renaming is separate, preview-first, collision-aware, and undo-logged.</text></svg>