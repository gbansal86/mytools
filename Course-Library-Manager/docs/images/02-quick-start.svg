<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430"><defs><style>.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.n{fill:#2563eb}.nt{font:700 22px Segoe UI,Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.h{font:700 20px Segoe UI,Arial;fill:#172033;text-anchor:middle}.t{font:15px Segoe UI,Arial;fill:#667085;text-anchor:middle}.arrow{stroke:#94a3b8;stroke-width:5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1500" height="430"/><text x="750" y="55" text-anchor="middle" style="font:700 30px Segoe UI,Arial;fill:#172033">Five-step quick start</text><rect class="box" x="40" y="110" width="240" height="220" rx="18"/><circle class="n" cx="160" cy="105" r="28"/><text class="nt" x="160" y="105">1</text><text class="h" x="160" y="165">Run the launcher</text><text class="t" x="160" y="205">Double-click the BAT</text><text class="t" x="160" y="232">or silent VBS.</text><text class="t" x="160" y="275">One visible GUI window.</text><rect class="box" x="335" y="110" width="240" height="220" rx="18"/><circle class="n" cx="455" cy="105" r="28"/><text class="nt" x="455" y="105">2</text><text class="h" x="455" y="165">Select root</text><text class="t" x="455" y="205">Choose the folder</text><text class="t" x="455" y="232">containing your courses.</text><text class="t" x="455" y="275">Each child folder = course.</text><rect class="box" x="630" y="110" width="240" height="220" rx="18"/><circle class="n" cx="750" cy="105" r="28"/><text class="nt" x="750" y="105">3</text><text class="h" x="750" y="165">Preview cleanup</text><text class="t" x="750" y="205">Review rename CSV.</text><text class="t" x="750" y="232">Apply only if correct.</text><text class="t" x="750" y="275">Undo log is created.</text><rect class="box" x="925" y="110" width="240" height="220" rx="18"/><circle class="n" cx="1045" cy="105" r="28"/><text class="nt" x="1045" y="105">4</text><text class="h" x="1045" y="165">Build catalog</text><text class="t" x="1045" y="205">Optional FFmpeg helpers</text><text class="t" x="1045" y="232">add thumbnails/durations.</text><text class="t" x="1045" y="275">Original files stay in place.</text><rect class="box" x="1220" y="110" width="240" height="220" rx="18"/><circle class="n" cx="1340" cy="105" r="28"/><text class="nt" x="1340" y="105">5</text><text class="h" x="1340" y="165">Open &amp; learn</text><text class="t" x="1340" y="205">Search, play, seek,</text><text class="t" x="1340" y="232">change speed, resume.</text><text class="t" x="1340" y="275">Cards or Table view.</text><path class="arrow" d="M285 220 L325 220"/><path class="arrow" d="M580 220 L620 220"/><path class="arrow" d="M875 220 L915 220"/><path class="arrow" d="M1170 220 L1210 220"/></svg>