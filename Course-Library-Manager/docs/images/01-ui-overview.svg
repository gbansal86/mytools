<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><style>.bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#cfd7e6;stroke-width:2}.title{font:700 30px Segoe UI,Arial;fill:#172033}.sub{font:16px Segoe UI,Arial;fill:#667085}.h{font:700 20px Segoe UI,Arial;fill:#172033}.t{font:15px Segoe UI,Arial;fill:#344054}.btn{fill:#fff;stroke:#b9c4d6;stroke-width:2}.call{fill:#2563eb}.num{font:700 18px Segoe UI,Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{stroke:#2563eb;stroke-width:3;fill:none}.legend{font:700 17px Segoe UI,Arial;fill:#172033}.small{font:14px Segoe UI,Arial;fill:#667085}</style></defs><rect class="bg" width="1400" height="850"/><rect class="panel" x="40" y="35" width="960" height="760" rx="18"/><text class="title" x="70" y="82">Course Library Manager v1.5</text><text class="sub" x="70" y="112">Safe folder cleanup + local HTML course player/library</text><text class="t" x="70" y="158">Course root folder</text><rect class="btn" x="70" y="175" width="760" height="42" rx="7"/><text class="sub" x="88" y="202">C:\Users\YourName\Videos\Courses</text><rect class="btn" x="845" y="175" width="115" height="42" rx="7"/><text class="t" x="877" y="202">Browse...</text><rect class="panel" x="70" y="245" width="420" height="220" rx="12"/><text class="h" x="92" y="280">1. Folder Cleanup</text><text class="small" x="92" y="310">Preview first; files are never renamed.</text><rect class="btn" x="92" y="335" width="175" height="46" rx="7"/><text class="t" x="118" y="363">Preview Renames</text><rect class="btn" x="282" y="335" width="175" height="46" rx="7"/><text class="t" x="315" y="363">Apply Renames</text><rect class="btn" x="92" y="396" width="175" height="46" rx="7"/><text class="t" x="119" y="424">Undo Latest</text><rect class="btn" x="282" y="396" width="175" height="46" rx="7"/><text class="t" x="304" y="424">Cleanup Phrases</text><rect class="panel" x="510" y="245" width="450" height="220" rx="12"/><text class="h" x="532" y="280">2. Local HTML Course Library</text><text class="small" x="532" y="310">Cards/Table views, player, subtitles, resources.</text><rect class="btn" x="532" y="335" width="245" height="46" rx="7"/><text class="t" x="555" y="363">Create / Refresh HTML Catalog</text><rect class="btn" x="790" y="335" width="145" height="46" rx="7"/><text class="t" x="819" y="363">Open Catalog</text><rect class="btn" x="532" y="396" width="132" height="46" rx="7"/><text class="t" x="552" y="424">Settings...</text><rect class="btn" x="676" y="396" width="170" height="46" rx="7"/><text class="t" x="692" y="424">Install / Check</text><rect class="btn" x="857" y="396" width="78" height="46" rx="7"/><text class="t" x="869" y="424">Folder</text><text class="h" x="70" y="510">Activity</text><rect class="panel" x="70" y="530" width="890" height="180" rx="10"/><text class="small" x="90" y="562">[OK] Course Library Manager v1.5.0 ready.</text><text class="small" x="90" y="590">[INFO] Catalog compatibility self-test passed.</text><text class="small" x="90" y="618">[INFO] Scanning course 3/42...</text><rect x="70" y="730" width="720" height="18" rx="9" fill="#e6ebf3"/><rect x="70" y="730" width="430" height="18" rx="9" fill="#2563eb"/><text class="small" x="70" y="775">Cataloging course 25/42 · 59%</text><rect class="btn" x="845" y="724" width="115" height="42" rx="7"/><text class="t" x="886" y="751">Exit</text><circle class="call" cx="56" cy="195" r="18"/><text class="num" x="56" y="195">1</text><circle class="call" cx="480" cy="350" r="18"/><text class="num" x="480" y="350">2</text><circle class="call" cx="940" cy="350" r="18"/><text class="num" x="940" y="350">3</text><circle class="call" cx="940" cy="420" r="18"/><text class="num" x="940" y="420">4</text><circle class="call" cx="950" cy="570" r="18"/><text class="num" x="950" y="570">5</text><circle class="call" cx="790" cy="739" r="18"/><text class="num" x="790" y="739">6</text><text class="legend" x="1040" y="120">Numbered guide</text><text class="t" x="1040" y="165">1  Select the parent course folder</text><text class="t" x="1040" y="210">2  Preview / apply / undo folder cleanup</text><text class="t" x="1040" y="255">3  Build or open the HTML catalog</text><text class="t" x="1040" y="300">4  Configure / install optional helpers</text><text class="t" x="1040" y="345">5  Read progress and error details here</text><text class="t" x="1040" y="390">6  Progress bar shows long operations</text><text class="sub" x="1040" y="455">Illustration based on the v1.5 GUI.</text></svg>