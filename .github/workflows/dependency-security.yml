name: Dependency Security

on:
  pull_request:
    paths:
      - "Book-Duplicate-Finder/requirements-local.txt"
      - "Telegram-Local-Downloader-Windows/requirements.txt"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "Book-Duplicate-Finder/requirements-local.txt"
      - "Telegram-Local-Downloader-Windows/requirements.txt"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Python dependency manifests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Book-Duplicate-Finder/requirements-local.txt
            Telegram-Local-Downloader-Windows/requirements.txt

      - name: Install audit tooling
        shell: pwsh
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies and generate CycloneDX SBOMs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dependency-security | Out-Null

          $manifests = @(
            @{ Name = "book-duplicate-finder"; Path = "Book-Duplicate-Finder/requirements-local.txt" },
            @{ Name = "telegram-local-downloader"; Path = "Telegram-Local-Downloader-Windows/requirements.txt" }
          )

          $failed = $false

          foreach ($manifest in $manifests) {
            Write-Host "Auditing $($manifest.Path)"

            $auditPath = "dependency-security/$($manifest.Name)-audit.json"
            $sbomPath = "dependency-security/$($manifest.Name)-sbom.cdx.json"

            python -m pip_audit -r $manifest.Path --strict --progress-spinner off -f json -o $auditPath
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              Write-Warning "Dependency audit reported a vulnerability or resolution failure for $($manifest.Path)."
            }

            python -m pip_audit -r $manifest.Path --strict --progress-spinner off -f cyclonedx-json -o $sbomPath
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              Write-Warning "SBOM/audit generation reported a vulnerability or resolution failure for $($manifest.Path)."
            }
          }

          "DEPENDENCY_AUDIT_FAILED=$($failed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyTools-dependency-security
          path: dependency-security/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce dependency audit
        shell: pwsh
        run: |
          if ($env:DEPENDENCY_AUDIT_FAILED -eq "true") {
            throw "pip-audit reported a vulnerability or dependency-resolution failure. Review the uploaded evidence."
          }
