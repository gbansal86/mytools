name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static and repository checks
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.py |
            Where-Object {
              $_.FullName -notmatch '\\.venv\\' -and
              $_.FullName -notmatch '\\venv\\' -and
              $_.FullName -notmatch '\\__pycache__\\'
            }

          Write-Host "Python files found: $($files.Count)"
          foreach ($file in $files) {
            Write-Host "Compiling $($file.FullName)"
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python compilation failed: $($file.FullName)"
            }
          }

      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.Extension -in '.ps1', '.psm1' }

          Write-Host "PowerShell files found: $($files.Count)"
          $allErrors = @()

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              foreach ($err in $errors) {
                $allErrors += "$($file.FullName): $($err.Message)"
              }
            }
          }

          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }

      - name: Validate repository community files
        shell: pwsh
        run: |
          $required = @(
            'LICENSE',
            'README.md',
            'CONTRIBUTING.md',
            'SECURITY.md',
            'SUPPORT.md',
            'CODE_OF_CONDUCT.md',
            'TESTING.md',
            'RELEASING.md',
            'ROADMAP.md',
            'OSS_PROJECT_OVERVIEW.md',
            'MAINTAINERS.md',
            'GOVERNANCE.md',
            '.github/dependabot.yml',
            '.github/PULL_REQUEST_TEMPLATE.md',
            '.github/ISSUE_TEMPLATE/bug_report.yml',
            '.github/ISSUE_TEMPLATE/feature_request.yml'
          )

          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "Missing required repository files: $($missing -join ', ')"
          }

      - name: Validate top-level tool documentation and licenses
        shell: pwsh
        run: |
          $excluded = @('.git', '.github')
          $toolDirs = Get-ChildItem -Path . -Directory |
            Where-Object { $_.Name -notin $excluded -and -not $_.Name.StartsWith('.') }

          $problems = @()
          foreach ($dir in $toolDirs) {
            if (-not (Test-Path (Join-Path $dir.FullName 'README.md'))) {
              $problems += "$($dir.Name): missing README.md"
            }
            if (-not (Test-Path (Join-Path $dir.FullName 'LICENSE'))) {
              $problems += "$($dir.Name): missing LICENSE"
            }
          }

          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Error $_ }
            throw "Tool structure validation failed."
          }

          Write-Host "Validated $($toolDirs.Count) top-level tool directories."
