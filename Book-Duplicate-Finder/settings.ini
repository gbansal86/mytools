[scan]
# Supported extensions. Add/remove extensions if needed.
extensions = .pdf,.epub,.chm,.djvu,.djv,.mobi,.azw,.azw3,.fb2,.txt,.rtf,.html,.htm,.xhtml,.docx,.cbz,.cbr

# Minimum size in bytes. Very tiny files are ignored.
min_file_size = 1024

# Maximum text characters retained after extraction per file.
# 0 means unlimited. 4,000,000 is normally plenty for fingerprinting.
max_text_chars = 4000000

[fingerprint]
# Number of minimum shingle hashes retained per book.
sketch_size = 512

# Words per content shingle.
shingle_words = 5

# Advance by this many words when producing shingles.
shingle_step = 2

# Number of page-image fingerprints for scans/comics when available.
image_samples = 12

# If extracted text has fewer characters than this, image fingerprints are attempted.
low_text_chars = 2500

[matching]
# Automatic grouping thresholds.
# containment = how much of the smaller document appears inside the larger one.
high_containment = 0.965
high_jaccard = 0.72
probable_containment = 0.90
probable_jaccard = 0.58
review_containment = 0.80
review_jaccard = 0.45

# Image similarity for scanned documents/comics, 0-1.
high_image_similarity = 0.90
probable_image_similarity = 0.84
review_image_similarity = 0.78

# Candidate generation avoids comparing every file with every other file.
# Lower this if you want a broader/slower scan.
minimum_shared_sketch_hashes = 2

[output]
open_report_after_scan = yes
